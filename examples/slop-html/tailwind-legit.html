<!doctype html><html><head><meta charset="utf-8"><title>billing settings — hand-written Tailwind</title></head><body>
  <!-- FP pin for slop.palette.tailwind-candy: neutral slate chrome, ONE deliberate emerald
       status note (single class attr, single hue — below minHits AND minAttrs), legacy-hue
       error text (red is not candy). A page a human Tailwind developer actually writes. -->
  <main class="max-w-md bg-white border border-slate-200 rounded p-6">
    <h2>결제 설정</h2>
    <p class="text-slate-600">사업자 정보와 영수증 이메일을 관리합니다.</p>
    <p class="text-red-600">카드가 만료되었습니다. 업로드를 유지하려면 갱신하세요.</p>
    <p class="rounded bg-emerald-50 px-3 py-2 text-emerald-800">저장되었습니다. 영수증은 billing@example.com 으로 발송됩니다.</p>
    <ul>
      <li>부가세 전자세금계산서 발행</li>
      <li>월 단위 일괄 결제</li>
    </ul>
  </main>
</body></html>
